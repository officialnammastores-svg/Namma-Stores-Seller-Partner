        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Namma Stores",
            "description": "Hyperlocal retail partner platform bringing neighbourhood stores in Whitefield, Bengaluru online.",
            "areaServed": {
              "@type": "Place",
              "name": "Whitefield, Bengaluru, Karnataka, India"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+91-9180567632",
              "email": "official.nammastores@gmail.com",
              "contactType": "seller onboarding support",
              "areaServed": "IN",
              "availableLanguage": ["en", "kn", "hi"]
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Who is eligible to become a Namma Stores Seller Partner?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Active physical retail shops and verified food & beverage (F&B) / fresh-produce suppliers operating in Whitefield, Bengaluru, and nearby supported neighbourhoods can apply.\n\nEligible categories include:\n- Grocery & Kirana\n- Fruits & Vegetables\n- Restaurants & Quick Bites\n- Bakery & Sweets\n- Meat, Fish & Poultry\n\nIn the application form, you can select from our six store categories: Grocery, Chicken, meat and fish, Fruits and vegetables, Milk and dairy products, Puja items and flowers, or \"Other or multiple categories\" (for Bakery & Sweets, Restaurants & Quick Bites, or multi-category stores, which undergo an onboarding eligibility review by our team)."
                }
              },
              {
                "@type": "Question",
                "name": "What documents are required during seller onboarding?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No documents need to be uploaded when you submit your initial application on this website. Our Namma Stores team will review and verify your application first. Once your application is verified, our onboarding team will guide you through Seller App access, identity verification (including your Aadhaar document), and bank account setup for seller settlements before your store goes live."
                }
              },
              {
                "@type": "Question",
                "name": "How does the 35-day introductory ₹0 platform fee offer work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Approved sellers receive ₹0 onboarding fee and ₹0 Namma Stores platform participation charges for their first 35 days. Importantly, the 35-day period starts only after your store is verified, approved, and activated live on the platform—not when you submit the application form. There is no lock-in commitment during or after the trial."
                }
              }
            ]
          }
        ]
      }
